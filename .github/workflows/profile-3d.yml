name: generate 3D contribution graph

on:
  schedule:
    - cron: "0 18 * * 1,4"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/profile-3d.yml"
      - "scripts/commit_generated.sh"

permissions:
  contents: write

concurrency:
  group: profile-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate 3d contribution graph
    steps:
      - uses: actions/checkout@v5

      - uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit 3D graphs to main
        run: bash scripts/commit_generated.sh "chore: update 3D contribution graph" profile-3d-contrib
